packages:
  - packages/*

# one (patched) copy of each, shared by mineflayer, bedrock-protocol and the ecosystem plugins
overrides:
  bedrock-protocol: 3.61.0
  minecraft-data: 3.119.0
  mineflayer: 4.39.0
  prismarine-block: 1.23.0
  prismarine-chat: 1.13.0
  prismarine-chunk: 1.41.0
  prismarine-entity: 2.6.0
  prismarine-item: 1.18.0
  prismarine-nbt: 2.8.0
  prismarine-physics: 1.11.1
  prismarine-recipe: 1.5.0
  prismarine-registry: 1.12.0
  prismarine-windows: 2.10.0
  prismarine-world: 3.7.0
  raknet-native: 1.2.3
  mineflayer-pathfinder: 2.4.5
  mineflayer-pvp: 1.3.2
  mineflayer-collectblock: 1.6.0
  mineflayer-tool: 1.2.0
  mineflayer-armor-manager: 2.0.1
  mineflayer-auto-eat: 5.0.3
  nethernet: 1.1.2

# bedrock-protocol depends on prismarine-xbox-services via a GitHub commit (not on npm)
blockExoticSubdeps: false

# the nethernet patch (PrismarineJS/node-nethernet#32, unreleased) requires jsonwebtoken
packageExtensions:
  nethernet@1.1.2:
    dependencies:
      jsonwebtoken: ^9.0.3

# the raknet-native patch loads its bundled prebuild instead of a cmake build
allowBuilds:
  raknet-native: false

patchedDependencies:
  bedrock-protocol@3.61.0: patches/bedrock-protocol@3.61.0.patch
  mineflayer-armor-manager@2.0.1: patches/mineflayer-armor-manager@2.0.1.patch
  mineflayer-auto-eat@5.0.3: patches/mineflayer-auto-eat@5.0.3.patch
  mineflayer-collectblock@1.6.0: patches/mineflayer-collectblock@1.6.0.patch
  mineflayer-pathfinder@2.4.5: patches/mineflayer-pathfinder@2.4.5.patch
  mineflayer-pvp@1.3.2: patches/mineflayer-pvp@1.3.2.patch
  mineflayer-tool@1.2.0: patches/mineflayer-tool@1.2.0.patch
  nethernet@1.1.2: patches/nethernet@1.1.2.patch
  prismarine-block@1.23.0: patches/prismarine-block@1.23.0.patch
  prismarine-chunk@1.41.0: patches/prismarine-chunk@1.41.0.patch
  prismarine-entity@2.6.0: patches/prismarine-entity@2.6.0.patch
  prismarine-item@1.18.0: patches/prismarine-item@1.18.0.patch
  prismarine-registry@1.12.0: patches/prismarine-registry@1.12.0.patch
  raknet-native@1.2.3: patches/raknet-native@1.2.3.patch
